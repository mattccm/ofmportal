name: Scheduled Jobs

# Railway has no built-in cron for HTTP endpoints, so these hit the deployed
# cron routes on schedule (replacing the old vercel.json crons). Set two repo
# secrets: APP_URL (e.g. https://portal.of-m.com) and CRON_SECRET (must match
# the app's CRON_SECRET env var).

on:
  schedule:
    - cron: "0 9 * * *" # reminders — daily 09:00 UTC
    - cron: "*/5 * * * *" # email queue + webhook retry — every 5 min
    - cron: "0 3 * * *" # cleanup — daily 03:00 UTC
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Reminders
        if: github.event.schedule == '0 9 * * *' || github.event_name == 'workflow_dispatch'
        run: curl -fsS "$APP_URL/api/cron/reminders" -H "Authorization: Bearer $CRON_SECRET"
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Email queue
        if: github.event.schedule == '*/5 * * * *' || github.event_name == 'workflow_dispatch'
        run: curl -fsS "$APP_URL/api/cron/email-queue" -H "Authorization: Bearer $CRON_SECRET"
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Webhook retry
        if: github.event.schedule == '*/5 * * * *' || github.event_name == 'workflow_dispatch'
        run: curl -fsS "$APP_URL/api/cron/webhook-retry" -H "Authorization: Bearer $CRON_SECRET"
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Cleanup
        if: github.event.schedule == '0 3 * * *' || github.event_name == 'workflow_dispatch'
        run: curl -fsS "$APP_URL/api/cron/cleanup" -H "Authorization: Bearer $CRON_SECRET"
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
